name: Manuscript build

on:
  pull_request:
    paths:
      - "manuscript/**"
      - "submission/**"
      - "ced/detection.py"
      - "ced/mode_detection.py"
      - "ced/target_safe_quotient.py"
      - "ced/learning_licensing.py"
      - "scripts/render_paper_b_figures.py"
      - "scripts/make_learning_licensing_figure.py"
      - "scripts/analyze_paper_b_reviewer_robustness.py"
      - "scripts/analyze_paper_b_posterior_bridge.py"
      - "scripts/paper_b_benchmark_core.py"
      - "scripts/simulate_paper_b_benchmark.py"
      - "scripts/audit_ced_final_submission.py"
      - ".github/workflows/manuscript-build.yml"
  push:
    branches: [main]
    paths:
      - "manuscript/**"
      - "submission/**"
      - "ced/detection.py"
      - "ced/mode_detection.py"
      - "ced/target_safe_quotient.py"
      - "ced/learning_licensing.py"
      - "scripts/render_paper_b_figures.py"
      - "scripts/make_learning_licensing_figure.py"
      - "scripts/analyze_paper_b_reviewer_robustness.py"
      - "scripts/analyze_paper_b_posterior_bridge.py"
      - "scripts/paper_b_benchmark_core.py"
      - "scripts/simulate_paper_b_benchmark.py"
      - "scripts/audit_ced_final_submission.py"
      - ".github/workflows/manuscript-build.yml"
  workflow_dispatch:

jobs:
  build-ced-standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate validated CED benchmark figures and compiled source
        run: |
          python scripts/render_paper_b_figures.py
          python scripts/make_learning_licensing_figure.py
      - name: Audit final citations and self-overlap
        run: |
          python scripts/audit_ced_final_submission.py
          test -s artifacts/ced_final_submission_audit.json
          test -s artifacts/ced_final_submission_audit.md
          cat artifacts/ced_final_submission_audit.md
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-pictures
      - name: Compile standalone CED main manuscript
        working-directory: manuscript
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error paper_b_compiled.tex
      - name: Compile standalone CED supplement
        working-directory: manuscript
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error paper_b_supplement.tex
      - name: Upload standalone CED / Ecological Modelling production package
        uses: actions/upload-artifact@v4
        with:
          name: ced-ecological-modelling-package
          path: |
            manuscript/paper_b_compiled.pdf
            manuscript/paper_b_compiled.log
            manuscript/paper_b_compiled.tex
            manuscript/paper_b_supplement.pdf
            manuscript/paper_b_supplement.log
            manuscript/paper_b_supplement.tex
            manuscript/CED_SUBMISSION_STATUS_2026-09-11.json
            manuscript/PUBLICATION_ROUTE_2026-09-11.md
            submission/ECOLOGICAL_MODELLING_SUBMISSION_CHECKLIST.md
            submission/ECOLOGICAL_MODELLING_HIGHLIGHTS.md
            submission/ECOLOGICAL_MODELLING_COVER_LETTER_DRAFT.md
            submission/ECOLOGICAL_MODELLING_DATA_CODE_STATEMENT.md
            submission/ECOLOGICAL_MODELLING_PACKAGE_MANIFEST.json
            submission/ECOLOGICAL_MODELLING_TITLE_PAGE_TEMPLATE.md
            manuscript/generated/evidence_learning_vs_licensing.svg
            manuscript/generated/evidence_learning_vs_licensing.csv
            manuscript/generated/paper_b_target_safe_quotient.tex
            manuscript/generated/paper_b_failure_architecture.tex
            manuscript/generated/paper_b_experiment_contrast.tex
            manuscript/generated/paper_b_strategy_outcomes.tex
            manuscript/generated/paper_b_target_switch.tex
            manuscript/generated/paper_b_threshold_sensitivity.tex
            manuscript/generated/paper_b_posterior_bridge_table.tex
            artifacts/paper_b_reviewer_robustness.json
            artifacts/paper_b_posterior_bridge.json
            artifacts/ced_final_submission_audit.json
            artifacts/ced_final_submission_audit.md
          retention-days: 14
